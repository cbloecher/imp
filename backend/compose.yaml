services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: imp
      POSTGRES_PASSWORD: imp-local-poc
      POSTGRES_DB: imp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - imp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imp -d imp"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  imp-db:
