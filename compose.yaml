services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imp}
      POSTGRES_USER: ${POSTGRES_USER:-imp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imp}
    volumes:
      - imp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imp} -d ${POSTGRES_DB:-imp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-imp}:${POSTGRES_PASSWORD:-imp}@postgres:5432/${POSTGRES_DB:-imp}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      IMP_BOOTSTRAP_DEFAULTS: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: ""
      VITE_BACKEND_PROXY: http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  imp_postgres:
